<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rethinka · 首次体验原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="lab">
  <section class="stage">
    <header class="stage-head">
      <div>
        <h1>Rethinka · 首次体验原型</h1>
        <p>引导式问答 onboarding ·「从想法到章法」四步闭环 · issue #1865</p>
      </div>
      <div class="entry-switch" id="entrySwitch"></div>
    </header>

    <div class="phone">
      <div class="notch"></div>
      <div class="screen">
        <div class="statusbar">
          <span>9:41</span>
          <span class="dots"><span>▮▮▮</span><span>◗</span><span>100%</span></span>
        </div>

        <!-- Cold-start splash. Sits above everything until it fades out. -->
        <div class="splash" id="splash">
          <div class="splash-inner">
            <div class="splash-mark">
              <span class="sm-r">R</span>
              <i class="sm-ring"></i>
            </div>
            <h2 class="splash-name">Rethinka</h2>
            <p class="splash-tag">从想法，到章法</p>
          </div>
          <div class="splash-foot">
            <div class="splash-bar"><i></i></div>
            <p class="splash-legal">仅供研究参考 · 不提供投资建议</p>
          </div>
        </div>

        <div class="rail" id="rail" role="button" tabindex="0"
             aria-expanded="false" aria-label="展开你的决策卡进度">
          <div class="rail-top">
            <span class="rail-label">你的决策卡</span>
            <span class="rail-count" id="railCount"></span>
          </div>
          <div class="rail-bar"><div class="rail-fill" id="railFill"></div></div>
          <div class="rail-slots" id="railSlots"></div>
        </div>

        <div class="body" id="body"></div>

        <!-- WeChat-style composer: mode toggle, text field, attachments, voice. -->
        <div class="footer" id="footer">
          <div class="composer">
            <button class="cmp-icon" id="modeToggle" aria-label="切换语音输入">🎙</button>

            <div class="cmp-field" id="cmpField">
              <input
                type="text"
                class="cmp-input"
                id="cmpInput"
                placeholder="说点什么，或者直接选下面的选项"
                aria-label="输入消息"
              />
              <button class="cmp-hold" id="cmpHold" hidden>按住 说话</button>
            </div>

            <button class="cmp-icon" id="plusBtn" aria-label="更多：图片、文件" aria-expanded="false">＋</button>
            <button class="cmp-send" id="sendBtn" hidden aria-label="发送">↑</button>
          </div>

          <div class="attach" id="attachPanel" hidden>
            <button class="att" data-kind="photo"><span class="att-ico">🖼</span>照片</button>
            <button class="att" data-kind="camera"><span class="att-ico">📷</span>拍摄</button>
            <button class="att" data-kind="file"><span class="att-ico">📄</span>文件</button>
            <button class="att" data-kind="screenshot"><span class="att-ico">📱</span>持仓截图</button>
          </div>

          <span class="footer-hint" id="footerHint"></span>
        </div>

        <div class="voicewrap" id="voiceWrap">
          <div class="voicecard">
            <div class="cue">松开发送 · 上滑取消</div>
            <div class="live" id="voiceLive"></div>
            <div class="wave">
              <i style="animation-delay:0ms"></i><i style="animation-delay:80ms"></i>
              <i style="animation-delay:160ms"></i><i style="animation-delay:40ms"></i>
              <i style="animation-delay:200ms"></i><i style="animation-delay:120ms"></i>
              <i style="animation-delay:260ms"></i><i style="animation-delay:60ms"></i>
              <i style="animation-delay:180ms"></i><i style="animation-delay:100ms"></i>
              <i style="animation-delay:220ms"></i><i style="animation-delay:20ms"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <aside class="story" id="story"></aside>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
